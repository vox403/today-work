<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VOXTEK Today Work</title>

  <!-- 루트 6월 3일자 마지막 수정 -->
  <style>
    :root {
      --bg:#02070d;
      --panel:#06111d;
      --line:rgba(0,216,255,.32);
      --line2:rgba(117,204,255,.28);
      --cyan:#35e7ff;
      --text:#eaf8ff;
      --sub:#9bc9d9;
      --danger:#ff4778;
      --good:#65ffdc;
      --warn:#ffd36a;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 70% 10%,rgba(62,0,46,.45),transparent 38%),linear-gradient(180deg,#061424,#01050a 65%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    button,input{font:inherit}
    .shell{height:100vh;display:flex;flex-direction:column;padding:18px;gap:12px}
    .topbar{height:58px;border:1px solid var(--line);border-radius:18px;background:rgba(4,12,21,.86);display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 0 28px rgba(0,216,255,.08)}
    .brand{display:flex;align-items:baseline;gap:12px;letter-spacing:.06em}
    .brand strong{font-size:18px}
    .brand span{font-size:12px;color:#9fd7ea;letter-spacing:.18em}
    .right{display:flex;gap:10px;align-items:center}
    .pill{border:1px solid var(--line2);border-radius:999px;padding:8px 12px;color:#bce8f8;background:rgba(5,20,32,.76);font-size:12px}
    .btn{border:1px solid rgba(84,218,255,.5);background:rgba(2,16,29,.9);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:800;letter-spacing:.03em}
    .btn:hover,.btn:focus-visible{outline:none;border-color:#fff;box-shadow:0 0 20px rgba(0,216,255,.18)}
    .main{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}
    .viewport{min-width:0;min-height:0;border:1px solid var(--line);border-radius:18px;background:#01070d;position:relative;overflow:hidden}
    #gameCanvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#01070d}
    .hud{border:1px solid var(--line);border-radius:18px;background:rgba(3,10,18,.92);padding:16px;overflow:auto}
    .hud h2{margin:0 0 16px;font-size:18px}
    .row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(98,184,217,.16);padding:9px 0;gap:12px;font-size:13px}
    .row span:first-child{color:#8dc6d9}
    .row strong{text-align:right}
    .section-title{margin:18px 0 6px;color:var(--cyan);font-size:12px;letter-spacing:.18em}
    .help{font-size:12px;color:#bce8f8;line-height:1.7;margin-top:14px}
    .dialog{position:absolute;left:18px;right:18px;bottom:18px;border:1px solid rgba(0,216,255,.42);background:rgba(2,10,18,.94);box-shadow:0 0 30px rgba(0,0,0,.45);padding:16px;display:none;z-index:10}
    .dialog.open{display:block}
    .speaker{font-size:12px;color:#32e9ff;letter-spacing:.1em;font-weight:900;margin-bottom:8px}
    .dialog-text{white-space:pre-wrap;line-height:1.7;font-size:15px}
    .choices{display:grid;gap:8px;margin-top:14px}
    .choice{text-align:left;border:1px solid rgba(98,218,255,.28);background:rgba(2,18,32,.82);color:#eaf8ff;padding:10px 12px;border-radius:10px;cursor:pointer}
    .choice:hover,.choice:focus-visible{outline:none;border-color:#fff;background:rgba(0,80,110,.45)}
    .small-close{margin-top:14px}
    .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#bce8f8;line-height:1.7}
    .error{color:#ffb6cc}
    @media(max-width:820px){
      body{overflow:auto}
      .shell{height:auto;min-height:100vh;padding:10px}
      .main{grid-template-columns:1fr}
      .viewport{height:65vh}
      .hud{max-height:none}
      .brand span{display:none}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>VOXTEK TODAY WORK</strong>
        <span>DIRECT ASSIGNMENT CHANNEL</span>
      </div>
      <div class="right">
        <span class="pill" id="employeeBadge">사원 확인 중</span>
        <button class="btn" id="returnBtn" type="button">PORTAL</button>
      </div>
    </header>

    <main class="main">
      <section class="viewport" id="viewport">
        <canvas id="gameCanvas" width="960" height="640"></canvas>
        <div class="loading" id="loading">VOXTEK 업무 채널 연결 중...</div>
        <div class="dialog" id="dialog">
          <div class="speaker" id="speaker"></div>
          <div class="dialog-text" id="dialogText"></div>
          <div class="choices" id="choices"></div>
        </div>
      </section>

      <aside class="hud">
        <h2>오늘의 업무</h2>
        <div class="row"><span>상태</span><strong id="hudStatus">대기</strong></div>
        <div class="row"><span>업무 지시</span><strong id="hudOrder">미수신</strong></div>
        <div class="row"><span>CCTV</span><strong id="hudCctv">미확인</strong></div>
        <div class="row"><span>일일 업무</span><strong id="hudDaily">미완료</strong></div>
        <div class="row"><span>평가 반영</span><strong id="hudScore">0</strong></div>
        <div class="row"><span>좌표</span><strong id="hudPos">-</strong></div>

        <div class="section-title">AFFECTION LOG</div>
        <div class="row"><span>VELVET</span><strong id="affVelvet">0</strong></div>
        <div class="row"><span>VALENTINO</span><strong id="affValentino">0</strong></div>
        <div class="row"><span>VOX</span><strong id="affVox">0</strong></div>

        <div class="help">
          이동: 방향키 / WASD 길게 누르기<br>
          상호작용: Space / Enter<br>
          업무 순서: 단말기 → CCTV → 단말기 보고<br>
        </div>
      </aside>
    </main>
  </div>

  function tileOf(x, y) {
    return { tx:Math.floor(x / TILE), ty:Math.floor(y / TILE) };
  }

  function layerGid(layer, tx, ty) {
    if (!layer || tx < 0 || ty < 0 || tx >= mapW || ty >= mapH) return 0;
    return layer.data[ty * mapW + tx] || 0;
  }

  function collisionAt(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= mapW || ty >= mapH) return true;
    return !!layerGid(collisionLayer, tx, ty);
  }

  function objectTileRects(obj) {
    if (obj.point) {
      const t = tileOf(obj.x, obj.y);
      return [{ minX:t.tx, maxX:t.tx, minY:t.ty, maxY:t.ty }];
    }
    const min = tileOf(obj.x, obj.y);
    const max = tileOf((obj.x || 0) + Math.max(1, obj.width || 1) - 1, (obj.y || 0) + Math.max(1, obj.height || 1) - 1);
    return [{ minX:min.tx, maxX:max.tx, minY:min.ty, maxY:max.ty }];
  }

  function playerTile() { return tileOf(player.x, player.y); }

  function rectDistanceToPlayer(obj) {
    const p = playerTile();
    let best = Infinity;
    for (const r of objectTileRects(obj)) {
      const cx = Math.max(r.minX, Math.min(p.tx, r.maxX));
      const cy = Math.max(r.minY, Math.min(p.ty, r.maxY));
      const d = Math.abs(p.tx - cx) + Math.abs(p.ty - cy);
      best = Math.min(best, d);
    }
    return best;
  }

  function objectNear(names, distance=1) {
    const list = objects.filter(o => names.includes(o.name));
    return list.find(o => rectDistanceToPlayer(o) <= distance) || null;
  }

  function npcObjects() {
    return [
      { id:"vox", name:"npc_vox" },
      { id:"valentino", name:"npc_valentino" },
      { id:"velvet", name:"npc_velvet" }
    ].map(n => ({ ...n, obj:objects.find(o => o.name === n.name) })).filter(n => n.obj);
  }

  function npcBlocks(tx, ty) {
    for (const n of npcObjects()) {
      for (const r of objectTileRects(n.obj)) {
        if (tx >= r.minX && tx <= r.maxX && ty >= r.minY && ty <= r.maxY) return true;
      }
    }
    return false;
  }

  function blockedAtPixel(x, y) {
    const t = tileOf(x, y);
    if (collisionAt(t.tx, t.ty)) return true;
    if (npcBlocks(t.tx, t.ty)) return true;
    return false;
  }

  function drawLayer(layer) {
    const data = layer.data;
    for (let y=0; y<layer.height; y++) {
      for (let x=0; x<layer.width; x++) {
        const gid = data[y * layer.width + x];
        if (!gid) continue;
        const idx = gid - 1;
        const sx = (idx % columns) * TILE;
        const sy = Math.floor(idx / columns) * TILE;
        ctx.drawImage(images.tiles, sx, sy, TILE, TILE, x*TILE, y*TILE, TILE, TILE);
      }
    }
  }

  function drawObjectLabel(obj, label) {
    const x = obj.x + (obj.width || 0)/2;
    const y = obj.y - 10;
    ctx.save();
    ctx.font = "10px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const w = Math.max(34, ctx.measureText(label).width + 10);
    ctx.fillStyle = "rgba(0,0,0,.72)";
    ctx.strokeStyle = "#00d8ff";
    ctx.lineWidth = 1;
    ctx.fillRect(x - w/2, y - 9, w, 18);
    ctx.strokeRect(x - w/2, y - 9, w, 18);
    ctx.fillStyle = "#dff9ff";
    ctx.fillText(label, x, y);
    ctx.restore();
  }

  function render(now=0) {
    if (!ready) return;
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const rect = viewport.getBoundingClientRect();
    const cssW = Math.max(320, Math.floor(rect.width));
    const cssH = Math.max(320, Math.floor(rect.height));
    if (canvas.width !== Math.floor(cssW*dpr) || canvas.height !== Math.floor(cssH*dpr)) {
      canvas.width = Math.floor(cssW*dpr);
      canvas.height = Math.floor(cssH*dpr);
      canvas.style.width = cssW + "px";
      canvas.style.height = cssH + "px";
    }

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = "#01070d";
    ctx.fillRect(0,0,cssW,cssH);

    const cameraX = Math.max(0, Math.min(mapW*TILE - cssW/ZOOM, player.drawX - cssW/(2*ZOOM)));
    const cameraY = Math.max(0, Math.min(mapH*TILE - cssH/ZOOM, player.drawY - cssH/(2*ZOOM)));

    ctx.save();
    ctx.scale(ZOOM, ZOOM);
    ctx.translate(-Math.floor(cameraX), -Math.floor(cameraY));

    for (const layer of tileLayers) drawLayer(layer);

    const cctv = objects.find(o => o.name === "cctv_console");
    const quest = objects.find(o => o.name === "quest_terminal");
    const vox = objects.find(o => o.name === "npc_vox");
    const val = objects.find(o => o.name === "npc_valentino");
    const vel = objects.find(o => o.name === "npc_velvet");

    if (cctv) drawObjectLabel(cctv, "CCTV");
    if (quest) drawObjectLabel(quest, "TERMINAL");
    if (vox) drawObjectLabel(vox, "VOX");
    if (val) drawObjectLabel(val, "VAL");
    if (vel) drawObjectLabel(vel, "VEL");

    let img = images.idle;
    if (moving) img = Math.floor(now / 80) % 2 ? images.step1 : images.step2;
    ctx.drawImage(img, Math.round(player.drawX - 16), Math.round(player.drawY - 48), 32, 48);

    ctx.restore();

    updateHud();
    requestAnimationFrame(render);
  }

  function updateMovement(now) {
    if (moving) {
      const t = Math.min(1, (now - moving.start) / MOVE_MS);
      const ease = 1 - Math.pow(1 - t, 3);
      player.drawX = moving.fromX + (moving.toX - moving.fromX) * ease;
      player.drawY = moving.fromY + (moving.toY - moving.fromY) * ease;
      if (t >= 1) {
        player.x = moving.toX;
        player.y = moving.toY;
        player.drawX = player.x;
        player.drawY = player.y;
        moving = null;
      }
      return;
    }
    if (dialogOpen) return;
    if (desiredDir && held.size) {
      const d = dirs[desiredDir];
      facing = desiredDir;
      const nx = player.x + d.x * TILE;
      const ny = player.y + d.y * TILE;
      if (!blockedAtPixel(nx, ny)) {
        moving = { start:now, fromX:player.x, fromY:player.y, toX:nx, toY:ny };
      }
    }
  }

  function gameLoop(now) {
    updateMovement(now);
    requestAnimationFrame(gameLoop);
  }

    box.innerHTML = "";
    for (const choice of choices) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      btn.textContent = choice.label;
      btn.addEventListener("click", () => choice.onClick && choice.onClick());
      box.appendChild(btn);
    }
    if (!choices.length) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn small-close";
      btn.textContent = "닫기";
      btn.addEventListener("click", closeDialog);
      box.appendChild(btn);
    }
    $("dialog").classList.add("open");
  }

    $("dialog").classList.remove("open");

  function randomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function specialText(npc) {
    const name = employee.name || "직원";
    if (npc === "vox") return `${name}. 이제 이름 정도는 기억해두지.\n그 기록이 계속 쓸모 있다면, 내 시스템에서도 지워지진 않을 거다.`;
    if (npc === "valentino") return `오, ${name}. 이제 이름까지 외웠네.\n계속 눈에 띄면… 한 번쯤은 내 화면 안에 넣어줄지도 모르지.`;
    return `${name}, 이제 네 이름은 기억해.\n그 정도면 화면 밖 배경은 아니란 뜻이야.`;
  }

  async function postEvent(payload) {
    const headers = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    };

    const send = async (body) => fetch(`${SUPABASE_URL}/rest/v1/voxtek_events`, {
      method:"POST",
      headers,
      body: JSON.stringify(body)
    });

    try {
      let res = await send(payload);
      if (res.ok) return true;

      const fallback = {
        created_at: payload.created_at,
        local_date: payload.local_date,
        event_type: payload.event_type,
        account_id: payload.account_id,
        employee_name: payload.employee_name,
        mission_id: payload.mission_id || null,
        creature_name: payload.creature_name || null,
        mission_day: payload.mission_day || null,
        points: payload.points || null,
        affection: payload.affection || null,
        session_id: payload.session_id || "",
        user_agent: payload.user_agent || navigator.userAgent,
        detail: payload.detail || {}
      };
      res = await send(fallback);
      return res.ok;
    } catch (error) {
      console.warn("Supabase record failed", error);
      return false;
    }
  }

  async function completeDailyWork() {
    if (state.done) {
      openDialog("SYSTEM", "오늘의 업무는 이미 완료됐다.\n기회는 하루에 한 번뿐이다.");
      return;
    }
    state.done = true;
    state.score = 10;
    state.dbStatus = "기록 중";
    saveState();
    openDialog("SYSTEM", "오늘의 업무 완료.\n일 가산점 +10점이 반영됩니다.");

    const ok = await postEvent({
      created_at:new Date().toISOString(),
      local_date:today,
      event_type:"DAILY_ORDER_CLEARED",
      account_id:employee.id,
      employee_name:employee.name,
      event_key:"today_work_cctv",
      score_gain:10,
      detail:{
        source:"today_work",
        channel:"today_work",
        mission_key:"today_work_cctv",
        quest_id:"daily_cctv_report",
        order_text:"CCTV 기록 확인",
        score_gain:10,
        client_time:new Date().toISOString()
      },
      session_id:localStorage.getItem("voxtek_mission_session_v1") || "",
      user_agent:navigator.userAgent
    });
    state.dbStatus = ok ? "기록 완료" : "로컬 완료";
    saveState();
  }

  function handleTerminal() {
    if (!state.instructed) {
      state.instructed = true;
      saveState();
      openDialog("VOXTEK TERMINAL", "오늘의 업무다. CCTV 기록을 확인해.\n확인했으면 이 단말기에 보고하고.");
      return;
    }
    if (!state.cctv) {
      openDialog("VOXTEK TERMINAL", "거기서 꾸물거릴 시간이 있으면 일을 해.\nCCTV 기록부터 확인해.");
      return;
    }
    completeDailyWork();
  }

  function handleCctv() {
    if (!state.instructed) {
      openDialog("CCTV CONSOLE", "먼저 일일 업무 단말기에서 지시를 수신해.\n업무 지시 전 조회는 기록에 반영되지 않는다.");
      return;
    }
    if (state.cctv) {
      openDialog("CCTV CONSOLE", "CCTV 기록은 이미 확인했다.\n이제 단말기에 보고해.");
      return;
    }
    state.cctv = true;
    saveState();
    openDialog("CCTV CONSOLE", "CCTV 기록 확인 완료.\n이상 징후 없음. 단말기에 보고해.");
  }

  function handleNpc(npc) {
    if (npc === "vox" && !state.done) {
      openDialog("VOX", "업무부터 끝내.\n사적인 대화는 보고가 끝난 뒤에 받지.");
      return;
    }

    const label = npc === "vox" ? "VOX" : npc === "valentino" ? "VALENTINO" : "VELVET";
    const current = affection[npc] || 0;

    if (current >= 100) {
      openDialog(`${label} (${current})`, specialText(npc));
      return;
    }

    if (talked[npc]) {
      openDialog(`${label} (${current})`, "오늘 대화는 끝.\n더 기록할 대화는 없다.");
      return;
    }

    const item = randomItem(dialogue[npc]);
    const choices = item.a.map(([labelText, delta, result]) => ({
      label: labelText,
      onClick: async () => {
        affection[npc] = (affection[npc] || 0) + delta;
        talked[npc] = true;
        saveState();
        openDialog(`${label} (${affection[npc]})`, `${result}\n\n호감도 ${delta > 0 ? "+"+delta : delta}`);
        postEvent({
          created_at:new Date().toISOString(),
          local_date:today,
          event_type:"NPC_AFFECTION",
          account_id:employee.id,
          employee_name:employee.name,
          npc_id:npc,
          affection_delta:delta,
          detail:{
            source:"today_work",
            npc_id:npc,
            affection_delta:delta,
            choice_text:labelText,
            dialogue:item.q,
            result_text:result,
            client_time:new Date().toISOString()
          },
          session_id:localStorage.getItem("voxtek_mission_session_v1") || "",
          user_agent:navigator.userAgent
        });
      }
    }));

    openDialog(`${label} (${current})`, item.q, choices);
  }

  function inspectGeneric() {
    const d = dirs[facing] || dirs.down;
    const p = playerTile();
    const tx = p.tx + d.x;
    const ty = p.ty + d.y;
    const gidFurniture = layerGid(layers.Furniture, tx, ty);
    const gidDecor = layerGid(layers.Decor, tx, ty);
    const gidWall = layerGid(layers.Wall, tx, ty);

    if (gidFurniture || gidDecor) {
      const messages = [
        "업무용 설비다. 괜히 만졌다가 기록 남기지 않는 게 좋겠다.",
        "복스테크 내부 장비다. 허가 없는 조작은 로그에 남는다.",
        "잠시 쉴 수 있는 소파이다. 하지만 업무 시간에 앉아 있을 생각은 아니겠지?",
        "모니터가 낮은 소리로 깜빡인다. 누군가 지켜보고 있는 것 같다."
      ];
      openDialog("SYSTEM", messages[(gidFurniture + gidDecor + tx + ty) % messages.length]);
      return;
    }
    if (gidWall) {
      openDialog("SYSTEM", "막혀 있다. 업무 동선은 이쪽이 아니다.");
      return;
    }
    openDialog("SYSTEM", "상호작용 가능한 대상이 없다.");
  }

  function interact() {
    if (dialogOpen) { closeDialog(); return; }

    const quest = objectNear(["quest_terminal"], 2);
    const voxObj = objectNear(["npc_vox"], 2);
    const cctv = objectNear(["cctv_console"], 2);
    const val = objectNear(["npc_valentino"], 1);
    const vel = objectNear(["npc_velvet"], 1);

    if (quest) return handleTerminal();
    if (cctv) return handleCctv();

    if (voxObj) return handleNpc("vox");
    if (val) return handleNpc("valentino");
    if (vel) return handleNpc("velvet");

    inspectGeneric();
  }

  window.addEventListener("keydown", (event) => {
    if (event.repeat && dialogOpen) return;
    if (event.code === "Space" || event.code === "Enter") {
      event.preventDefault();
      interact();
      return;
    }
    const dir = keyToDir[event.code];
    if (dir) {
      event.preventDefault();
      held.add(event.code);
      desiredDir = dir;
      facing = dir;
    }
  });

  window.addEventListener("keyup", (event) => {
    const dir = keyToDir[event.code];
    if (dir) {
      held.delete(event.code);
      if (!held.size) desiredDir = null;
      else {
        const last = Array.from(held).reverse().find(code => keyToDir[code]);
        desiredDir = last ? keyToDir[last] : null;
      }
    }
  });

  async function start() {
    try {
      await loadAssets();
      ready = true;
      loading.style.display = "none";
      saveState();
      requestAnimationFrame(render);
      requestAnimationFrame(gameLoop);
      if (!state.instructed) {
        setTimeout(() => openDialog("SYSTEM", "오늘의 업무 채널 접속 완료.\n오른쪽 업무 단말기에서 지시를 수신해."), 350);
      }
    } catch (error) {
      loading.classList.add("error");
      loading.textContent = "업무 채널 초기화 실패. 파일을 다시 업로드하거나 캐시를 지운 뒤 새로고침해.";
      console.error(error);
    }
  }

  start();
})();
